<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL IN 零售週報</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --green: #1c3a2a; --bg: #f5f4f0; --line: #e0ded8; --mute: #8a8a84; --up: #16a34a; --down: #dc2626; }
html, body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", sans-serif; color: #1a1a1a; }

.top { position: sticky; max-width: 100vw; top: 0; z-index: 10; background: var(--green); color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
.top__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px 6px; }
.top__title { font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
.top__title span { opacity: .55; font-weight: 400; letter-spacing: .06em; text-transform: none; margin-left: 10px; }
.top__home { font-size: 12px; color: rgba(255,255,255,.65); text-decoration: none; white-space: nowrap; }
.top__home:hover { color: #fff; }

.strip-wrap { display: flex; align-items: stretch; gap: 6px; padding: 6px 12px 12px; }
.nav-btn { flex: none; width: 32px; border: 1px solid rgba(255,255,255,.18); background: transparent; color: #fff; border-radius: 6px; font-size: 16px; cursor: pointer; }
.nav-btn:hover:not(:disabled) { background: rgba(255,255,255,.1); }
.nav-btn:disabled { opacity: .25; cursor: default; }
.strip { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; padding-bottom: 4px; }
.month { flex: none; display: flex; flex-direction: column; }
.month__lbl { font-size: 10px; letter-spacing: .1em; color: rgba(255,255,255,.45); padding: 0 4px 4px; border-left: 1px solid rgba(255,255,255,.15); }
.month__weeks { display: flex; gap: 4px; padding-left: 4px; border-left: 1px solid rgba(255,255,255,.15); }
.wk { flex: none; width: 92px; border: 1px solid transparent; background: rgba(255,255,255,.06); color: #fff; border-radius: 6px; padding: 6px 8px 7px; text-align: left; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 3px; }
.wk:hover { background: rgba(255,255,255,.12); }
.wk.on { background: #fff; color: var(--green); }
.wk__bar { height: 28px; display: flex; align-items: flex-end; }
.wk__bar i { display: block; width: 100%; border-radius: 2px 2px 0 0; background: rgba(255,255,255,.35); }
.wk.on .wk__bar i { background: var(--green); }
.wk__range { font-size: 11px; font-weight: 600; white-space: nowrap; }
.wk__total { font-size: 11px; opacity: .8; }
.wk__pct { font-size: 10px; font-weight: 600; }
.wk__pct.up { color: #86efac; } .wk__pct.down { color: #fca5a5; }
.wk.on .wk__pct.up { color: var(--up); } .wk.on .wk__pct.down { color: var(--down); }
.wk__new { font-size: 9px; letter-spacing: .08em; background: #fbbf24; color: #1a1a1a; border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }

.frame { display: block; width: 100%; border: 0; min-height: calc(100vh - 140px); background: var(--bg); }
.loading { text-align: center; color: var(--mute); font-size: 12px; padding: 40px 0; }

@media (max-width: 640px) {
  .top__bar { padding: 12px 16px 4px; }
  .top__title span { display: none; }
  .strip-wrap { padding: 4px 8px 10px; }
  .nav-btn { width: 26px; }
  .wk { width: 84px; }
}
</style>
</head>
<body>

<div class="top">
  <div class="top__bar">
    <div class="top__title">ALL IN · 零售週報<span id="span"></span></div>
    <a class="top__home" href="../">← 工具首頁</a>
  </div>
  <div class="strip-wrap">
    <button class="nav-btn" id="prev" aria-label="上一週">‹</button>
    <div class="strip" id="strip"></div>
    <button class="nav-btn" id="next" aria-label="下一週">›</button>
  </div>
</div>

<iframe class="frame" id="frame" title="週報內容"></iframe>

<script src="weeks.js"></script>
<script>
(function () {
  const W = window.WEEKS || [];
  const strip = document.getElementById('strip');
  const frame = document.getElementById('frame');
  const max = Math.max.apply(null, W.map(w => w.total));
  const fmt = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : '$' + Math.round(n / 1000) + 'K';
  const monthOf = w => w.file.slice(5, 7);

  document.getElementById('span').textContent = W.length ? W[0].range.split('–')[0] + ' – ' + W[W.length - 1].range.split('–')[1] + '　共 ' + W.length + ' 週' : '';

  // 依月份分組（以週日所在月份）
  let html = '', cur = null;
  W.forEach((w, i) => {
    const mo = monthOf(w);
    if (mo !== cur) { if (cur) html += '</div></div>'; html += '<div class="month"><div class="month__lbl">' + (+mo) + ' 月</div><div class="month__weeks">'; cur = mo; }
    const dir = w.pct.startsWith('+') ? 'up' : 'down';
    const h = Math.max(8, Math.round(w.total / max * 100));
    html += '<button class="wk" data-i="' + i + '" title="四櫃合計 $' + w.total.toLocaleString() + '（' + w.pct + '）">' +
      '<span class="wk__bar"><i style="height:' + h + '%"></i></span>' +
      '<span class="wk__range">' + w.range + (i === W.length - 1 ? '<span class="wk__new">最新</span>' : '') + '</span>' +
      '<span class="wk__total">' + fmt(w.total) + '</span>' +
      '<span class="wk__pct ' + dir + '">' + (dir === 'up' ? '▲ ' : '▼ ') + w.pct + '</span></button>';
  });
  if (cur) html += '</div></div>';
  strip.innerHTML = html;

  let idx = -1;
  function show(i, push) {
    if (i < 0 || i >= W.length) return;
    idx = i;
    strip.querySelectorAll('.wk').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    const on = strip.querySelector('.wk.on');
    if (on) on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: push ? 'smooth' : 'auto' });
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === W.length - 1;
    frame.src = W[i].file + '.html';
    document.title = 'ALL IN 零售週報 · ' + W[i].range;
    if (push) history.replaceState(null, '', '#' + W[i].file);
  }

  // 內嵌時隱藏週報本身的返回連結與週次列，並讓高度貼合內容
  function fit() {
    try {
      const d = frame.contentDocument;
      if (!d) return;
      if (!d.getElementById('hub-style')) {
        const s = d.createElement('style'); s.id = 'hub-style';
        s.textContent = '.back,.week-nav{display:none!important}';
        d.head.appendChild(s);
        d.querySelectorAll('a[href]').forEach(a => { if (!a.getAttribute('href').startsWith('#')) a.target = '_top'; });
      }
      frame.style.height = d.documentElement.scrollHeight + 'px';
    } catch (e) {}
  }
  frame.addEventListener('load', () => {
    window.scrollTo(0, 0); fit(); setTimeout(fit, 300);
    try { frame.contentWindow.addEventListener('click', () => setTimeout(fit, 50)); } catch (e) {}
  });
  window.addEventListener('resize', fit);

  strip.addEventListener('click', e => { const b = e.target.closest('.wk'); if (b) show(+b.dataset.i, true); });
  document.getElementById('prev').onclick = () => show(idx - 1, true);
  document.getElementById('next').onclick = () => show(idx + 1, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') show(idx - 1, true);
    if (e.key === 'ArrowRight') show(idx + 1, true);
  });

  const fromHash = W.findIndex(w => '#' + w.file === location.hash);
  show(fromHash >= 0 ? fromHash : W.length - 1, false);
})();
</script>
</body>
</html>
